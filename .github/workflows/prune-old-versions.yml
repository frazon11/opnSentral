name: Prune old versions

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prune-old-versions.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      KEEP_FROM: "0.6.11.13"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete releases and tags older than threshold
        shell: bash
        run: |
          set -euo pipefail

          version_is_older() {
            local candidate="${1#v}"
            local threshold="${KEEP_FROM#v}"
            [ "$(printf '%s\n%s\n' "$candidate" "$threshold" | sort -V | head -n1)" = "$candidate" ] \
              && [ "$candidate" != "$threshold" ]
          }

          echo "Keeping version ${KEEP_FROM} and newer."

          gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | [.id, .tag_name] | @tsv' |
          while IFS=$'\t' read -r release_id tag; do
            clean="${tag#v}"
            if [[ "$clean" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] && version_is_older "$clean"; then
              echo "Deleting release $tag"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/${release_id}"
            fi
          done

          gh api --paginate "/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/" \
            --jq '.[].ref' |
          while IFS= read -r ref; do
            tag="${ref#refs/tags/}"
            clean="${tag#v}"
            if [[ "$clean" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]] && version_is_older "$clean"; then
              echo "Deleting tag $tag"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}"
            fi
          done

          echo "Version cleanup completed."
