name: Publish opnSentral bootstrap image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-opnsentral-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish opnSentral
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ghcr.io/frazon11/opnsentral:0.6.11.13
            ghcr.io/frazon11/opnsentral:latest
          labels: |
            org.opencontainers.image.title=opnSentral
            org.opencontainers.image.source=https://github.com/frazon11/opnSentral
            org.opencontainers.image.version=0.6.11.13
