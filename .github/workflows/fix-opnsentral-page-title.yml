name: Fix opnSentral page title

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-opnsentral-page-title.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-title:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Replace browser page title
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/inc/header.php')
          content = path.read_text(encoding='utf-8')
          old = '<title>opnCentral</title>'
          new = '<title>opnSentral</title>'

          if old not in content:
              if new in content:
                  print('Page title is already correct.')
                  raise SystemExit(0)
              raise SystemExit('Expected page title was not found.')

          path.write_text(content.replace(old, new), encoding='utf-8')
          PY

      - name: Commit page-title correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/inc/header.php
          git commit -m "Change browser title to opnSentral"
          git push
