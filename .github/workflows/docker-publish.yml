name: Build and publish opnSentral

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "webssh/**"
      - "scripts/check-admin-api-login.php"
      - "scripts/check-agent-runtime-isolation.php"
      - "scripts/check-agent-recovery.php"
      - "scripts/check-feature-contracts.php"
      - "scripts/check-firmware-ui.php"
      - "scripts/check-ids-rendering.php"
      - "scripts/check-webssh.php"
      - "opnsense-plugin/opnsentral-agent/**"
      - "Dockerfile"
      - "apache.conf"
      - "entrypoint.sh"
      - ".github/workflows/docker-publish.yml"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: opnsentral-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check merge-conflict markers
        run: sh scripts/check-merge-markers.sh

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/^const OPNSENTRAL_VERSION = '\([^']*\)';$/\1/p" app/inc/update_check.php)
          test -n "$VERSION" || { echo "::error::Could not read OPNSENTRAL_VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Docker Hub secrets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::DOCKERHUB_USERNAME is missing"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::DOCKERHUB_TOKEN is missing"; exit 1; }

      - name: Verify Docker build context
        shell: bash
        run: |
          test -f Dockerfile || { echo "::error::Dockerfile is missing from repository root"; exit 1; }
          test -d app || { echo "::error::app directory is missing from repository root"; exit 1; }
          test -f webssh/server.js || { echo "::error::webssh/server.js is missing"; exit 1; }
          test -f webssh/package.json || { echo "::error::webssh/package.json is missing"; exit 1; }
          echo "Building version: ${{ steps.version.outputs.version }}"
          echo "Building commit: $GITHUB_SHA"
          echo "Triggered by ref: $GITHUB_REF"

      - name: Lint PHP and JavaScript sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find app -type f \( -name '*.php' -o -path 'app/agent/opnsentral-agent' \) -print0)
          php -l scripts/check-admin-api-login.php >/dev/null
          php -l scripts/check-agent-recovery.php >/dev/null
          php -l scripts/check-feature-contracts.php >/dev/null
          php -l scripts/check-firmware-ui.php >/dev/null
          php -l scripts/check-ids-rendering.php >/dev/null
          php -l scripts/check-webssh.php >/dev/null
          php -l opnsense-plugin/opnsentral-agent/src/etc/inc/plugins.inc.d/opnsentralagent.inc >/dev/null
          node --check webssh/server.js

      - name: Check admin API-key login
        run: php scripts/check-admin-api-login.php
      - name: Check agent runtime config isolation
        run: php scripts/check-agent-runtime-isolation.php
      - name: Check agent recovery
        run: php scripts/check-agent-recovery.php
      - name: Check feature contracts
        run: php scripts/check-feature-contracts.php
      - name: Check firmware UI
        run: php scripts/check-firmware-ui.php
      - name: Check IDS rendering
        run: php scripts/check-ids-rendering.php
      - name: Check WebSSH
        run: php scripts/check-webssh.php

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate opnSentral image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/frazon11/opnsentral
            docker.io/frazon11/opnsentral
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish opnSentral
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
