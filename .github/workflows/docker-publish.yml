name: Build and publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check merge-conflict markers
        run: sh scripts/check-merge-markers.sh

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/^const OPNSENTRAL_VERSION = '\([^']*\)';$/\1/p" app/inc/update_check.php)
          test -n "$VERSION" || {
            echo "::error::Could not read OPNSENTRAL_VERSION"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify Docker Hub secrets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || {
            echo "::error::DOCKERHUB_USERNAME is missing"
            exit 1
          }
          test -n "$DOCKERHUB_TOKEN" || {
            echo "::error::DOCKERHUB_TOKEN is missing"
            exit 1
          }

      - name: Verify Docker build contexts
        shell: bash
        run: |
          test -f Dockerfile || { echo "::error::Dockerfile is missing from repository root"; exit 1; }
          test -d app || { echo "::error::app directory is missing from repository root"; exit 1; }
          test -f telemetry-server/Dockerfile || { echo "::error::telemetry-server/Dockerfile is missing"; exit 1; }
          test -d telemetry-server/app || { echo "::error::telemetry-server/app directory is missing"; exit 1; }
          echo "Building version: ${{ steps.version.outputs.version }}"
          echo "Building commit: $GITHUB_SHA"
          echo "Triggered by ref: $GITHUB_REF"

      - name: Lint PHP sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find app -type f \( -name '*.php' -o -path 'app/agent/opnsentral-agent' \) -print0)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate opnSentral image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/frazon11/opnsentral
            docker.io/frazon11/opnsentral
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Generate telemetry image metadata
        id: telemetry_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/frazon11/opnsentral-telemetry
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish opnSentral
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and publish opnSentral telemetry
        uses: docker/build-push-action@v7
        with:
          context: ./telemetry-server
          file: ./telemetry-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          build-args: |
            OPNSENTRAL_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.telemetry_meta.outputs.tags }}
          labels: ${{ steps.telemetry_meta.outputs.labels }}
