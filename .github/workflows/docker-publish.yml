name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply static sidebar menu
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          header = Path('app/inc/header.php')
          text = header.read_text()
          old = '''        <a class="<?= nav_active(['/aliases.php','/alias_overview.php']) ?>" href="/alias_overview.php">≡ <span><?= h(t('menu.aliases')) ?></span></a>
          <a class="<?= nav_active(['/categories.php','/category_overview.php']) ?>" href="/category_overview.php">▤ <span><?= h(t('menu.categories')) ?></span></a>
          <a class="<?= nav_active(['/backups.php']) ?>" href="/backups.php">⬇ <span>Backups</span></a>

          <div class="nav-group"><?= h(t('menu.settings')) ?></div>'''
          new = '''        <a class="<?= nav_active(['/aliases.php','/alias_overview.php']) ?>" href="/alias_overview.php">≡ <span><?= h(t('menu.aliases')) ?></span></a>
          <a class="<?= nav_active(['/geoip_settings.php']) ?>" href="/geoip_settings.php">◉ <span>GeoIP Settings</span></a>
          <a class="<?= nav_active(['/categories.php','/category_overview.php']) ?>" href="/category_overview.php">▤ <span><?= h(t('menu.categories')) ?></span></a>
          <a class="<?= nav_active(['/backups.php']) ?>" href="/backups.php">⬇ <span>Backups</span></a>

          <div class="nav-group">System</div>
          <div class="nav-section-label">Configuration</div>
          <a class="nav-child<?= nav_active(['/backups.php']) ?>" href="/backups.php"><span>Backup</span></a>
          <div class="nav-section-label">Firmware</div>
          <a class="nav-child<?= nav_active(['/system_firmware_status.php']) ?>" href="/system_firmware_status.php"><span>Status</span></a>
          <a class="nav-child<?= nav_active(['/plugins.php']) ?>" href="/plugins.php"><span>Plugins</span></a>

          <div class="nav-group"><?= h(t('menu.settings')) ?></div>'''

          if old in text:
              text = text.replace(old, new, 1)
          for required in ('/geoip_settings.php', '/system_firmware_status.php', '/plugins.php'):
              if required not in text:
                  raise SystemExit(f'Missing static menu link: {required}')
          text = text.replace('<span>v0.6.11.1</span>', '<span>v0.6.20.6</span>', 1)
          header.write_text(text)

          footer = Path('app/inc/footer.php')
          ft = footer.read_text()
          ft = re.sub(r'''\n\s*const aliasLink = document\.querySelector\('\.side-nav a\[href="/alias_overview\.php"\]'\);.*?\n\s*const path = location\.pathname;''', '\n\n    const path = location.pathname;', ft, flags=re.S)
          ft = re.sub(r'''\n\s*const settingsLink = document\.querySelector\('\.side-nav a\[href="/settings\.php"\]'\);.*?\n\s*const path = location\.pathname;''', '\n\n    const path = location.pathname;', ft, flags=re.S)
          ft = ft.replace('v0.6.20.5', 'v0.6.20.6').replace('v0.6.20.4', 'v0.6.20.6')
          ft = ft.replace('06205', '06206').replace('06204', '06206')
          if 'system-main-menu' in ft:
              raise SystemExit('Old JavaScript System menu injection still exists')
          footer.write_text(ft)

          version = Path('app/inc/update_check.php')
          vt = version.read_text()
          vt = re.sub(r"const OPNCENTRAL_VERSION = '[^']+';", "const OPNCENTRAL_VERSION = '0.6.20.6';", vt, count=1)
          version.write_text(vt)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/inc/header.php app/inc/footer.php app/inc/update_check.php
          if ! git diff --cached --quiet; then
            git commit -m 'Render System and GeoIP menus statically'
            git push
          fi

      - name: Check merge-conflict markers
        run: sh scripts/check-merge-markers.sh

      - name: Verify Docker Hub secrets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || {
            echo "::error::DOCKERHUB_USERNAME is missing"
            exit 1
          }
          test -n "$DOCKERHUB_TOKEN" || {
            echo "::error::DOCKERHUB_TOKEN is missing"
            exit 1
          }

      - name: Verify Docker build context
        shell: bash
        run: |
          test -f Dockerfile || { echo "::error::Dockerfile is missing from repository root"; exit 1; }
          test -d app || { echo "::error::app directory is missing from repository root"; exit 1; }
          echo "Building commit: $GITHUB_SHA"
          echo "Triggered by ref: $GITHUB_REF"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/frazon11/opnsentral
            docker.io/frazon11/opnsentral
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=0.6.20.6
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Show generated image tags
        shell: bash
        run: echo '${{ steps.meta.outputs.tags }}'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
