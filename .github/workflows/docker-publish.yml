name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check merge-conflict markers
        run: sh scripts/check-merge-markers.sh

      - name: Verify Docker Hub secrets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || {
            echo "::error::DOCKERHUB_USERNAME is missing"
            exit 1
          }
          test -n "$DOCKERHUB_TOKEN" || {
            echo "::error::DOCKERHUB_TOKEN is missing"
            exit 1
          }

      - name: Verify Docker build context
        shell: bash
        run: |
          test -f Dockerfile || { echo "::error::Dockerfile is missing from repository root"; exit 1; }
          test -d app || { echo "::error::app directory is missing from repository root"; exit 1; }
          echo "Building commit: $GITHUB_SHA"
          echo "Triggered by ref: $GITHUB_REF"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/frazon11/opnsentral
            docker.io/frazon11/opnsentral
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=0.6.20.10
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Show generated image tags
        shell: bash
        run: echo '${{ steps.meta.outputs.tags }}'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
