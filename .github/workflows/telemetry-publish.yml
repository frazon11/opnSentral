name: Build and publish opnSentral telemetry

on:
  push:
    branches:
      - main
    paths:
      - "telemetry-server/**"
      - ".github/workflows/telemetry-publish.yml"
  workflow_dispatch:

concurrency:
  group: opnsentral-telemetry-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/^const OPNSENTRAL_VERSION = '\([^']*\)';$/\1/p" app/inc/update_check.php)
          test -n "$VERSION" || { echo "::error::Could not read OPNSENTRAL_VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify telemetry build context
        shell: bash
        run: |
          test -f telemetry-server/Dockerfile || { echo "::error::telemetry-server/Dockerfile is missing"; exit 1; }
          test -d telemetry-server/app || { echo "::error::telemetry-server/app directory is missing"; exit 1; }

      - name: Lint telemetry PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find telemetry-server/app -type f -name '*.php' -print0)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate telemetry image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/frazon11/opnsentral-telemetry
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish opnSentral telemetry
        uses: docker/build-push-action@v7
        with:
          context: ./telemetry-server
          file: ./telemetry-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          build-args: |
            OPNSENTRAL_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
