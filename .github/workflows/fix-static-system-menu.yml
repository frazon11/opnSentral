name: Fix static System menu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace injected menu with static markup
        shell: python
        run: |
          from pathlib import Path
          import re

          header = Path('app/inc/header.php')
          text = header.read_text()

          old = '''        <a class="<?= nav_active(['/aliases.php','/alias_overview.php']) ?>" href="/alias_overview.php">≡ <span><?= h(t('menu.aliases')) ?></span></a>
          <a class="<?= nav_active(['/categories.php','/category_overview.php']) ?>" href="/category_overview.php">▤ <span><?= h(t('menu.categories')) ?></span></a>
          <a class="<?= nav_active(['/backups.php']) ?>" href="/backups.php">⬇ <span>Backups</span></a>

          <div class="nav-group"><?= h(t('menu.settings')) ?></div>'''

          new = '''        <a class="<?= nav_active(['/aliases.php','/alias_overview.php']) ?>" href="/alias_overview.php">≡ <span><?= h(t('menu.aliases')) ?></span></a>
          <a class="<?= nav_active(['/geoip_settings.php']) ?>" href="/geoip_settings.php">◉ <span>GeoIP Settings</span></a>
          <a class="<?= nav_active(['/categories.php','/category_overview.php']) ?>" href="/category_overview.php">▤ <span><?= h(t('menu.categories')) ?></span></a>
          <a class="<?= nav_active(['/backups.php']) ?>" href="/backups.php">⬇ <span>Backups</span></a>

          <div class="nav-group">System</div>
          <div class="nav-section-label">Configuration</div>
          <a class="nav-child<?= nav_active(['/backups.php']) ?>" href="/backups.php"><span>Backup</span></a>
          <div class="nav-section-label">Firmware</div>
          <a class="nav-child<?= nav_active(['/system_firmware_status.php']) ?>" href="/system_firmware_status.php"><span>Status</span></a>
          <a class="nav-child<?= nav_active(['/plugins.php']) ?>" href="/plugins.php"><span>Plugins</span></a>

          <div class="nav-group"><?= h(t('menu.settings')) ?></div>'''

          if old not in text:
              raise SystemExit('Expected sidebar block not found in header.php')
          text = text.replace(old, new, 1)
          text = text.replace('<span>v0.6.11.1</span>', '<span>v0.6.20.6</span>', 1)
          header.write_text(text)

          footer = Path('app/inc/footer.php')
          ft = footer.read_text()
          ft = re.sub(r'''\n\s*const aliasLink = document\.querySelector\('\.side-nav a\[href="/alias_overview\.php"\]'\);.*?\n\s*const path = location\.pathname;''', '\n\n    const path = location.pathname;', ft, flags=re.S)
          ft = re.sub(r'''\n\s*const settingsLink = document\.querySelector\('\.side-nav a\[href="/settings\.php"\]'\);.*?\n\s*const path = location\.pathname;''', '\n\n    const path = location.pathname;', ft, flags=re.S)
          ft = ft.replace('v0.6.20.5', 'v0.6.20.6').replace('v0.6.20.4', 'v0.6.20.6')
          ft = ft.replace('06205', '06206').replace('06204', '06206')
          footer.write_text(ft)

          version = Path('app/inc/update_check.php')
          vt = version.read_text().replace("const OPNCENTRAL_VERSION = '0.6.20.5';", "const OPNCENTRAL_VERSION = '0.6.20.6';")
          vt = vt.replace("const OPNCENTRAL_VERSION = '0.6.20.4';", "const OPNCENTRAL_VERSION = '0.6.20.6';")
          version.write_text(vt)

          docker = Path('.github/workflows/docker-publish.yml')
          dt = docker.read_text().replace('type=raw,value=0.6.20.5', 'type=raw,value=0.6.20.6')
          dt = dt.replace('type=raw,value=0.6.20.4', 'type=raw,value=0.6.20.6')
          docker.write_text(dt)

          required = [
              '/geoip_settings.php', '/backups.php',
              '/system_firmware_status.php', '/plugins.php'
          ]
          final = header.read_text()
          for item in required:
              if item not in final:
                  raise SystemExit(f'Missing static menu link: {item}')

          if 'system-main-menu' in footer.read_text():
              raise SystemExit('Old JavaScript System menu injection still exists')

      - name: Commit corrected menu
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/inc/header.php app/inc/footer.php app/inc/update_check.php .github/workflows/docker-publish.yml
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Render System and GeoIP menus statically'
          git push

# Triggered after workflow installation.
