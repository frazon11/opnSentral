name: Validate disabled Agents page

on:
  push:
    branches:
      - disable/agents-page

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check merge-conflict markers
        run: sh scripts/check-merge-markers.sh

      - name: Check Docker build cache configuration
        run: sh scripts/check-docker-build-cache.sh

      - name: Lint PHP and JavaScript sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find app -type f \( -name '*.php' -o -path 'app/agent/opnsentral-agent' \) -print0)
          php -l scripts/check-acme-overview.php >/dev/null
          php -l scripts/check-admin-api-login.php >/dev/null
          php -l scripts/check-agent-recovery.php >/dev/null
          php -l scripts/check-agents-disabled.php >/dev/null
          php -l scripts/check-feature-contracts.php >/dev/null
          php -l scripts/check-firmware-ui.php >/dev/null
          php -l scripts/check-ids-rendering.php >/dev/null
          php -l scripts/check-plugin-management.php >/dev/null
          php -l scripts/check-wireguard-overview.php >/dev/null
          php -l scripts/check-webssh.php >/dev/null
          php -l opnsense-plugin/opnsentral-agent/src/etc/inc/plugins.inc.d/opnsentralagent.inc >/dev/null
          node --check webssh/server.js

      - name: Check ACME overview
        run: php scripts/check-acme-overview.php
      - name: Check admin API-key login
        run: php scripts/check-admin-api-login.php
      - name: Check agent runtime config isolation
        run: php scripts/check-agent-runtime-isolation.php
      - name: Check agent recovery
        run: php scripts/check-agent-recovery.php
      - name: Check Agents disabled state
        run: php scripts/check-agents-disabled.php
      - name: Check feature contracts
        run: php scripts/check-feature-contracts.php
      - name: Check firmware UI
        run: php scripts/check-firmware-ui.php
      - name: Check IDS rendering
        run: php scripts/check-ids-rendering.php
      - name: Check plugin management
        run: php scripts/check-plugin-management.php
      - name: Check WireGuard overview
        run: php scripts/check-wireguard-overview.php
      - name: Check WebSSH
        run: php scripts/check-webssh.php

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build multi-architecture image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          pull: true
          cache-from: type=gha,scope=opnsentral-docker
