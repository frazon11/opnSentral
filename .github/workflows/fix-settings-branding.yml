name: Fix settings branding

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-settings-branding.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Replace legacy branding in settings page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/settings.php')
          s = p.read_text(encoding='utf-8')
          s = s.replace('opnCentral', 'opnSentral')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/settings.php
          git commit -m 'Replace legacy opnCentral branding in settings' || exit 0
          git push
