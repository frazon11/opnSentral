name: Validate telemetry PHP 8.5.12 branch

on:
  push:
    branches:
      - security/telemetry-php-8.5.12

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify telemetry security pin
        shell: bash
        run: |
          set -euo pipefail
          test -f telemetry-server/Dockerfile
          test -d telemetry-server/app
          grep -F 'FROM php:8.5.12-apache-trixie' telemetry-server/Dockerfile
          grep -F 'version_compare(PHP_VERSION, "8.5.12", "<")' telemetry-server/Dockerfile
          grep -F '"app/inc/update_check.php"' .github/workflows/telemetry-publish.yml

      - name: Lint telemetry PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find telemetry-server/app -type f -name '*.php' -print0)

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build telemetry multi-architecture image without publishing
        uses: docker/build-push-action@v7
        with:
          context: ./telemetry-server
          file: ./telemetry-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          pull: true
          no-cache: true
          build-args: |
            OPNSENTRAL_VERSION=branch-test
