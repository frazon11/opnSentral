services:
  opnsentral-telemetry:
    image: ghcr.io/frazon11/opnsentral-telemetry:${TELEMETRY_VERSION:-latest}
    container_name: opnSentral-Telemetry
    restart: unless-stopped

    ports:
      - "${TELEMETRY_WEB_PORT:-8791}:80"

    environment:
      TZ: ${TZ:-Europe/Brussels}
      TELEMETRY_WRITE_TOKEN: ${TELEMETRY_WRITE_TOKEN:-}
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      RETENTION_DAYS: ${RETENTION_DAYS:-730}

    volumes:
      - "${TELEMETRY_BASE_PATH}/data:/var/www/data"

    healthcheck:
      test:
        - CMD-SHELL
        - php -r '$$pdo=new PDO("sqlite:/var/www/data/telemetry.sqlite"); echo "ok";' || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
