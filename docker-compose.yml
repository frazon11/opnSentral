services:
  opncentral:
    image: ghcr.io/frazon11/opncentral:0.6.11.13
    container_name: OpnCentral
    restart: unless-stopped

    ports:
      - "${WEB_PORT}:80"

    environment:
      TZ: Europe/Brussels
      APP_NAME: OpnCentral
      APP_KEY: DEIN_64_STELLIGER_HEX_SCHLUESSEL
      ADMIN_USER: admin
      ADMIN_PASSWORD: DEIN_PASSWORT
      SESSION_SECURE: "false"
      ALERTS_ENABLED: ${ALERTS_ENABLED}
      ALERT_VPN: ${ALERT_VPN}
      ALERT_CHECK_INTERVAL: ${ALERT_CHECK_INTERVAL}
      ALERT_FAILURE_THRESHOLD: ${ALERT_FAILURE_THRESHOLD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURITY: ${SMTP_SECURITY}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      NOTIFY_TO: ${NOTIFY_TO}
      PRECHANGE_BACKUP_RETENTION: ${PRECHANGE_BACKUP_RETENTION:-20}
      TELEMETRY_URL: ${TELEMETRY_URL:-}
      TELEMETRY_WRITE_TOKEN: ${TELEMETRY_WRITE_TOKEN:-}

    volumes:
      - ${BASE_PATH}/data:/var/www/data
      - ${BASE_PATH}/backups:/var/www/backups

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1/health.php || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
