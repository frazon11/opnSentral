[agent.status]
command:/usr/sbin/service
parameters:opnsentral_agent onestatus
type:script_output
message:read opnSentral agent service status
allowed_groups:wheel,wwwonly

[agent.start]
command:/usr/sbin/service
parameters:opnsentral_agent start
type:script_output
message:start opnSentral agent service
allowed_groups:wheel,wwwonly

[agent.stop]
command:/usr/sbin/service
parameters:opnsentral_agent stop
type:script_output
message:stop opnSentral agent service
allowed_groups:wheel,wwwonly

[agent.restart]
command:/usr/sbin/service
parameters:opnsentral_agent restart
type:script_output
message:restart opnSentral agent service
allowed_groups:wheel,wwwonly

[sshlockout.status]
command:/usr/local/opnsense/scripts/OPNsense/OpnSentralAgent/sshlockout.php
parameters:status
type:script_output
message:read SSH/WebGUI lockout trusted hosts
allowed_groups:wheel,wwwonly

[sshlockout.trust]
command:/usr/local/opnsense/scripts/OPNsense/OpnSentralAgent/sshlockout.php
parameters:trust %s
type:script_output
message:add trusted SSH/WebGUI host %s
allowed_groups:wheel,wwwonly

[sshlockout.untrust]
command:/usr/local/opnsense/scripts/OPNsense/OpnSentralAgent/sshlockout.php
parameters:untrust %s
type:script_output
message:remove trusted SSH/WebGUI host %s
allowed_groups:wheel,wwwonly

[sshlockout.sync]
command:/usr/local/opnsense/scripts/OPNsense/OpnSentralAgent/sshlockout.php
parameters:sync
type:script_output
message:synchronize trusted SSH/WebGUI hosts
allowed_groups:wheel,wwwonly
